<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">协程生命周期与调度状态</title>
  <desc id="desc">协程从创建进入就绪队列，被调度后运行；它可以完成、主动让出、等待事件、被唤醒或在任意未完成状态收到取消。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <style>
      .state{fill:#f8fafc;stroke:#475569;stroke-width:2.2}
      .active{fill:#eef2ff;stroke:#4f46e5;stroke-width:2.4}
      .terminal{fill:#f0fdfa;stroke:#0f766e;stroke-width:2.2}
      .label{font:600 24px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#111827;text-anchor:middle}
      .edge{font:17px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#475569;text-anchor:middle}
      .arrow{stroke:#4b5563;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
      .cancel{stroke:#b91c1c;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="560" fill="#fff"/>
  <rect class="state" x="55" y="215" width="170" height="75" rx="36"/>
  <text class="label" x="140" y="260">已创建</text>
  <rect class="state" x="315" y="80" width="190" height="80" rx="12"/>
  <text class="label" x="410" y="128">就绪</text>
  <rect class="active" x="605" y="80" width="190" height="80" rx="12"/>
  <text class="label" x="700" y="128">运行</text>
  <rect class="state" x="605" y="325" width="190" height="80" rx="12"/>
  <text class="label" x="700" y="373">等待事件</text>
  <rect class="terminal" x="955" y="80" width="190" height="80" rx="36"/>
  <text class="label" x="1050" y="128">完成</text>
  <rect class="terminal" x="955" y="325" width="190" height="80" rx="36"/>
  <text class="label" x="1050" y="373">已取消</text>
  <path class="arrow" d="M225 230 C270 185 285 150 315 130"/>
  <text class="edge" x="274" y="184">入队</text>
  <path class="arrow" d="M505 120 H600"/>
  <text class="edge" x="552" y="105">调度</text>
  <path class="arrow" d="M700 165 V320"/>
  <text class="edge" x="760" y="244">await / 阻塞</text>
  <path class="arrow" d="M605 365 C480 365 455 180 605 140"/>
  <text class="edge" x="490" y="290">事件就绪</text>
  <path class="arrow" d="M690 80 C650 25 500 25 430 75"/>
  <text class="edge" x="560" y="28">yield / 时间片</text>
  <path class="arrow" d="M795 120 H950"/>
  <text class="edge" x="870" y="105">return / 异常</text>
  <path class="cancel" d="M795 365 H950"/>
  <text class="edge" x="872" y="350">取消被观察</text>
  <path class="cancel" d="M790 155 C900 210 970 245 1020 320"/>
  <text class="edge" x="938" y="224">传播取消</text>
  <text class="edge" x="600" y="500">挂起只保存继续执行所需状态；调度、唤醒、取消与资源回收是彼此独立的契约</text>
</svg>
