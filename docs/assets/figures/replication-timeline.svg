<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="650" viewBox="0 0 1300 650" role="img" aria-labelledby="title desc">
  <title id="title">复制写入的提交点与客户端可见性</title>
  <desc id="desc">客户端向领导者提交写入，领导者追加日志并复制给两个跟随者；当法定多数确认后提交，再向客户端确认并将已提交状态应用。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <style>
      .lane{stroke:#94a3b8;stroke-width:2;stroke-dasharray:6 6}
      .message{stroke:#475569;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
      .commit{stroke:#4f46e5;stroke-width:3}
      .label{font:600 22px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#111827;text-anchor:middle}
      .sub{font:17px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#475569;text-anchor:middle}
      .note{fill:#eef2ff;stroke:#4f46e5;stroke-width:1.8}
    </style>
  </defs>
  <rect width="1300" height="650" fill="#fff"/>
  <text class="label" x="150" y="55">客户端</text>
  <text class="label" x="470" y="55">领导者</text>
  <text class="label" x="790" y="55">跟随者 A</text>
  <text class="label" x="1110" y="55">跟随者 B</text>
  <path class="lane" d="M150 80 V590"/>
  <path class="lane" d="M470 80 V590"/>
  <path class="lane" d="M790 80 V590"/>
  <path class="lane" d="M1110 80 V590"/>
  <path class="message" d="M150 125 L465 165"/>
  <text class="sub" x="300" y="126">写入请求</text>
  <rect class="note" x="375" y="185" width="190" height="55" rx="8"/>
  <text class="sub" x="470" y="217">追加本地日志</text>
  <path class="message" d="M475 255 L785 300"/>
  <text class="sub" x="625" y="260">复制日志项</text>
  <path class="message" d="M475 275 L1105 345"/>
  <text class="sub" x="895" y="315">复制可并行</text>
  <path class="message" d="M790 360 L475 395"/>
  <text class="sub" x="625" y="385">确认持有日志</text>
  <path class="commit" d="M340 430 H600"/>
  <text class="label" x="470" y="458">法定多数 → 提交</text>
  <path class="message" d="M465 485 L155 515"/>
  <text class="sub" x="305" y="520">返回成功</text>
  <path class="message" d="M475 500 L785 545"/>
  <path class="message" d="M475 515 L1105 570"/>
  <text class="sub" x="850" y="610">后续消息传播提交索引并应用状态</text>
  <text class="sub" x="650" y="635">日志存在、已经提交、已经应用和客户端已经观察到是四个不同边界</text>
</svg>
