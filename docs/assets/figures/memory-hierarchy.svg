<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">内存层次中的容量、延迟与带宽权衡</title>
  <desc id="desc">从寄存器、缓存、主存到持久存储，容量逐层增大，访问延迟通常增加；程序通过局部性和批量传输利用层次结构。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <style>
      .tier{stroke:#334155;stroke-width:2}
      .label{font:600 24px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#111827;text-anchor:middle}
      .sub{font:18px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#475569;text-anchor:middle}
      .axis{stroke:#475569;stroke-width:2.4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="600" fill="#fff"/>
  <polygon class="tier" fill="#e0e7ff" points="500,55 700,55 750,135 450,135"/>
  <text class="label" x="600" y="92">寄存器</text>
  <text class="sub" x="600" y="120">显式数据依赖</text>
  <polygon class="tier" fill="#e8edff" points="450,155 750,155 820,250 380,250"/>
  <text class="label" x="600" y="195">L1 / L2 / LLC</text>
  <text class="sub" x="600" y="226">缓存行 · 预取 · 一致性</text>
  <polygon class="tier" fill="#eff6ff" points="380,270 820,270 900,380 300,380"/>
  <text class="label" x="600" y="316">DRAM</text>
  <text class="sub" x="600" y="349">通道 · Bank · NUMA · 页</text>
  <polygon class="tier" fill="#f0fdfa" points="300,400 900,400 1000,525 200,525"/>
  <text class="label" x="600" y="452">SSD / 持久存储</text>
  <text class="sub" x="600" y="487">块 · 队列 · 日志 · 写放大</text>
  <path class="axis" d="M105 80 V500"/>
  <text class="sub" x="105" y="545">容量与持久性增加</text>
  <path class="axis" d="M1095 500 V80"/>
  <text class="sub" x="1095" y="545">更低延迟与更细粒度</text>
  <text class="sub" x="600" y="575">局部性决定上层请求有多少能被更快层吸收</text>
</svg>
