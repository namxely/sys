          - 分层与分组: network/layers-packets.md
          - 以太网、IP 与路由: network/ethernet-ip-routing.md
          - TCP、UDP 与 QUIC: network/transport-tcp-udp-quic.md
          - 拥塞控制: network/congestion-control.md
          - DNS、HTTP 与 TLS: network/dns-http-tls.md
          - Socket 与 I/O 模型: network/sockets-io.md
          - 数据中心网络与 RDMA: network/datacenter-rdma.md
      - 存储:
          - 总览: storage/index.md
          - 层次与设备: storage/hierarchy-devices.md
          - SSD 与 NVMe: storage/ssd-nvme.md
          - 文件系统机制: storage/filesystems.md
          - 数据库存储: storage/database-storage.md
          - 缓存、日志与崩溃一致性: storage/caching-logging-consistency.md
  - 并行与分布式:
      - 并行计算:
          - 总览: parallel/index.md
          - Work、Span 与扩展定律: parallel/performance-models.md
          - 共享内存与 OpenMP: parallel/shared-memory-openmp.md
          - SIMD 与 SIMT: parallel/simd-simt.md
          - CUDA: parallel/cuda.md
